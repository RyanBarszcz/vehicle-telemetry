services:
  db:
    image: postgres:17-alpine
    container_name: driveiq-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: driveiq
      POSTGRES_USER: driveiq
      POSTGRES_PASSWORD: driveiq

    ports:
      - "5432:5432"

    volumes:
      - driveiq_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U driveiq -d driveiq"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: driveiq-backend
    restart: unless-stopped

    env_file:
      - ./backend/.env.docker

    environment:
      DATABASE_URL: postgresql://driveiq:driveiq@db:5432/driveiq
      FRONTEND_URL: http://localhost:3000

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: driveiq-frontend
    env_file:
      - ./frontend/.env.docker
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - driveiq_frontend_node_modules:/app/node_modules
      - driveiq_frontend_next:/app/.next
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  driveiq_postgres_data:
  driveiq_frontend_node_modules:
  driveiq_frontend_next: