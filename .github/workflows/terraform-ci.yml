name: Terraform CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform-ci.yml"

  push:
    branches:
      - main
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform-ci.yml"

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-2
  TF_WORKING_DIR: infra/terraform

jobs:
  terraform:
    name: Terraform Validate and Plan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::795176248415:role/driveiqTerraformPlanRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Validate Terraform
        run: terraform validate

      - name: Get current ECS images
        shell: bash
        run: |
          BACKEND_IMAGE=$(aws ecs describe-task-definition \
            --task-definition driveiq-backend \
            --region "$AWS_REGION" \
            --query 'taskDefinition.containerDefinitions[0].image' \
            --output text)

          WORKER_IMAGE=$(aws ecs describe-task-definition \
            --task-definition driveiq-worker \
            --region "$AWS_REGION" \
            --query 'taskDefinition.containerDefinitions[0].image' \
            --output text)

          echo "TF_VAR_backend_image=$BACKEND_IMAGE" >> "$GITHUB_ENV"
          echo "TF_VAR_worker_image=$WORKER_IMAGE" >> "$GITHUB_ENV"

      - name: Terraform plan
        run: terraform plan -input=false -no-color